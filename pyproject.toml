[project]
name = "pytrale"
version = "0.1.0"
description = "Python package to analyze weights exported from trale"
authors = [
    {name = "braniii", email = "daniel.nagel@protonmail.com"},
]
dependencies = [
    "numpy>=1.26.4",
    "python-dateutil>=2.9.0",
    "tqdm>=4.67.1",
]
requires-python = ">=3.11, <3.14"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/QuantumPhysique/pytrale"
Issues = "https://github.com/QuantumPhysique/pytrale/issues"

[project.optional-dependencies]
notebooks = [
    "matplotlib>=3.8.3",
    "prettypyplot>=0.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrale"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]
notebooks = [
    "jupyter>=1.1.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
